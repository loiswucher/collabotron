<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B5F66">
<title>Collabotron · Transmettre juste</title>
<style>:root{
  --teal:#0B5F66; --teal-d:#08464B; --teal-l:#E3F0F0;
  --olive:#6F7F2A; --olive-l:#EEF1DC;
  --orange:#D9651F; --orange-l:#FBE9DC;
  --ink:#10282B; --mute:#5B6E70; --line:#D5DEDE; --bg:#F4F7F6; --card:#fff;
  --ok:#2E7D4F; --ok-l:#E2F3E8; --bad:#B3402A; --bad-l:#FAE5E0; --mid:#B7791F; --mid-l:#FBF0D9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:580px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;margin:0 -14px 14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .brand{font-weight:700;letter-spacing:.2px;flex:1}
header.top a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
.timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:13px}
.timer.late{background:var(--orange)}
h1{font-size:22px;margin:6px 0 4px;line-height:1.25}
h2{font-size:18px;margin:18px 0 6px}
h3{font-size:16px;margin:14px 0 4px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.big{font-size:19px;line-height:1.45;padding:20px 16px}
.card.teal{background:var(--teal-l);border-color:#BFD9DA}
.card.olive{background:var(--olive-l);border-color:#D8DEB5}
.card.orange{background:var(--orange-l);border-color:#F1CDB4}
.card.ok{background:var(--ok-l);border-color:#BFE0CB}
.card.bad{background:var(--bad-l);border-color:#EBC2B9}
.card.mid{background:var(--mid-l);border-color:#EBD6A5}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:600;background:var(--teal);color:#fff;text-align:center;text-decoration:none;margin:8px 0;cursor:pointer}
.btn:active{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.orange{background:var(--orange)}
.btn.olive{background:var(--olive)}
.btn.ghost{background:transparent;color:var(--teal);font-weight:500;padding:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;background:var(--teal-l);color:var(--teal)}
.pill.ok{background:var(--ok-l);color:var(--ok)} .pill.bad{background:var(--bad-l);color:var(--bad)} .pill.orange{background:var(--orange-l);color:var(--orange)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--teal)}
.count{text-align:right;font-size:13px;color:var(--mute)}
.count.over{color:var(--bad);font-weight:700}
ul.clean{padding-left:20px;margin:6px 0} ul.clean li{margin:4px 0}
.station{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.station .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.station.done .num{background:var(--ok)}
.station .t{flex:1}
.station .t b{display:block}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--olive)}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px auto;max-width:420px}
.qrbox svg{width:100%;height:auto;display:block}
.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
.matrix td.k{text-align:left;width:46%}
.matrix th{background:var(--teal-l);font-size:13px}
.matrix button{width:100%;min-height:36px;border:0;border-radius:8px;background:#F0F3F3;font:inherit;font-weight:700;color:var(--mute)}
.matrix button.ok{background:var(--ok-l);color:var(--ok)}
.matrix button.def{background:var(--mid-l);color:var(--mid)}
.matrix button.no{background:var(--bad-l);color:var(--bad)}
.matrix button.pres{background:var(--orange-l);color:var(--orange)}
.matrix td.na{background:#EEF1F1;color:#9AA9AA}
.msg{border-left:4px solid var(--teal);background:#fff;padding:8px 12px;margin:8px 0;border-radius:0 10px 10px 0;white-space:pre-wrap}
.msg small{display:block;color:var(--mute);margin-bottom:2px;font-weight:600}
.legend span{display:inline-block;margin-right:10px;font-size:13px}
.counter{display:flex;align-items:center;gap:6px;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.counter button{width:38px;height:38px;border-radius:50%;border:2px solid var(--teal);background:#fff;color:var(--teal);font-size:20px;font-weight:700}
.notice{font-size:14px;color:var(--mute);margin:10px 0}
.hide{display:none}
blockquote{margin:6px 0;padding:6px 12px;border-left:4px solid var(--olive);background:var(--olive-l);border-radius:0 8px 8px 0}
@media print{ header.top,.btn,.noprint{display:none!important} body{background:#fff} }
.affiche{text-align:center;padding-top:20px}
.affiche h1{font-size:34px}
.affiche .qrbox{max-width:480px}

.proj{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:start;padding:26px 6px 40px;font-size:21px}
.proj h1{font-size:46px;margin:0}
.proj h2{font-size:26px;margin:22px 0 6px;color:var(--teal)}
.proj .sub{font-size:22px;color:var(--mute);margin:4px 0 10px}
.proj .small{font-size:14px;word-break:break-all}
.proj ol.steps{padding-left:28px;margin:6px 0} .proj ol.steps li{margin:8px 0}
.proj ol.plan{list-style:none;padding:0;margin:6px 0} .proj ol.plan li{padding:9px 0;border-bottom:1px solid var(--line)}
.proj .when{display:inline-block;min-width:250px;margin-right:12px;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.proj .dur{color:var(--orange);font-weight:700}
.proj .mute{font-size:17px}
.proj .qrcol{text-align:center;position:sticky;top:20px}
.proj .qrbox{max-width:520px;padding:14px}
.proj input[type=time]{font:inherit;font-size:17px;padding:4px 8px;border:2px solid var(--line);border-radius:8px}
@media(max-width:820px){.proj{grid-template-columns:1fr;font-size:18px}.proj h1{font-size:32px}.proj .qrcol{position:static;order:-1}}

.mode{border-radius:14px;padding:14px;margin:10px 0}
.mode.tous{background:#E4EEFB;border:2px solid #2F6FBF}
.mode.chacun{background:var(--orange-l);border:2px solid var(--orange)}
.mode .m1{font-size:20px;font-weight:800;letter-spacing:.3px}
.mode.tous .m1{color:#1F57A0} .mode.chacun .m1{color:#B44F12}
.mode .m2{font-weight:600;margin:2px 0 6px}
.mode ol.m3{margin:6px 0 0;padding-left:22px} .mode ol.m3 li{margin:6px 0}
.modebar{border-radius:10px;padding:6px 12px;margin:0 0 10px;font-weight:700;font-size:14px;text-align:center}
.modebar.tous{background:#E4EEFB;color:#1F57A0;border:1px solid #2F6FBF}
.modebar.chacun{background:var(--orange-l);color:#B44F12;border:1px solid var(--orange)}
.station .t .pill{margin-top:4px}

.card.station.cur{border:2px solid var(--orange);background:#FFF9F4}
.card.station.lock{opacity:.55}
.card.station.lock .num{background:#9AA9AA;font-size:15px}
.card.station .here{align-self:flex-start;background:var(--orange);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:1px 10px}
.btn.big{font-size:19px;padding:18px 16px;background:var(--orange)}
</style></head>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

    }).join("");
    var body = mode("tous", [
      "Rassemblez-vous autour de <b>ce téléphone</b>, posé au centre. Les autres restent dans la poche.",
      "Lisez à voix haute les faits d'origine, puis les messages, un par un.",
      "Remplissez le tableau <b>ensemble</b> : touchez une case seulement quand le groupe est d'accord.",
      "Répondez aux 3 questions de discussion, à voix haute.",
      "Quand vous avez fini, prenez le téléphone d'un autre pour la révélation suivante."]) + "<h1>La révélation</h1><p><b>Situation " + s.id + " : " + esc(s.titre) + "</b></p>" +
      "<h2>Ce que l'AS savait au départ</h2><div class=\"card teal\"><ul class=\"clean\">" + s.fiche.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul></div>" +
      "<h2>Ce que le médecin a prescrit</h2><div class=\"card orange\">« " + esc(s.prescription) + " »" + (n >= 4 ? "<p><b>Second appel :</b> « " + esc(s.prescription2) + " »</p>" : "") + "</div>" +
      "<h2>La chaîne, participant par participant</h2>" + msgs +
      "<h2>Analyse</h2><p>Pour chaque élément et chaque participant, touchez la case pour indiquer ce que contient le message.</p>" +
      '<p class="legend"><span><b>✓</b> bien transmis</span><span><b>≈</b> déformé</span><span><b>✗</b> perdu</span><span><b>·</b> pas évalué</span></p>' +
      '<div style="overflow-x:auto"><table class="matrix">' + head + rows + "</table></div>" +
      '<div id="sum"></div>' +
      "<h2>Ajouts qui ne figuraient pas dans les faits</h2><p class=\"mute\">Comptez, pour chaque participant, les informations inventées ou supposées.</p>" + counters +
      "<h2>À discuter ensemble</h2><div class=\"card olive\"><ol class=\"clean\">" + DATA.discussion.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ol></div>" +
      '<button class="btn alt" data-act="showfinal">Afficher le QR de la révélation pour mon groupe</button><div id="finalqr"></div>' +
      '<a class="btn" href="#/s3">Révélation terminée, retour à la station 3</a>';
    page("Révélation", body);
    summary();
  }
  function summary() {
    var s = sit(chain.s), n = chain.n, out = [];
    var keys = s.cles.map(function (_, i) { return "c" + i; }).concat(s.clesRx.map(function (_, i) { return "r" + i; })).concat(n >= 4 ? s.clesRx2.map(function (_, i) { return "q" + i; }) : []);
    for (var h = 1; h <= n; h++) {
      var ok = 0, def = 0, no = 0, tot = 0;
      keys.forEach(function (k) {
        if ((k.charAt(0) === "r" && h < 2) || (k.charAt(0) === "q" && h < 4)) return;
        var v = mx.g[k + "_" + h]; if (v === "ok") ok++; else if (v === "def") def++; else if (v === "no") no++;
      });
      if (ok + def + no) out.push("Participant " + h + " : " + ok + " bien transmis, " + def + " déformé" + (def > 1 ? "s" : "") + ", " + no + " perdu" + (no > 1 ? "s" : ""));
    }
    var el = $("#sum"); if (!el) return;
    el.innerHTML = out.length ? '<div class="card mid"><b>Bilan de la chaîne</b><ul class="clean">' + out.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + "</ul></div>" : "";
  }

  /* ---------- station 4 : bilan ---------- */
  function s4() {
    var good = 0; DATA.cartes.forEach(function (c, i) { var a = ST.s1.a[i]; if (a && a.pile === c.pile && (c.pile !== "A" || a.quand === c.quand)) good++; });
    page("Bilan", '<h1>Station 4 : bilan</h1>' + mode("chacun", ["Chacun écrit <b>seul</b> les deux phrases ci-dessous (3 minutes).", "Ensuite, <b>ensemble</b>, vous les lisez à voix haute, puis vous répondez à la question de clôture."]) +
      '<label for="j"><b>Une phrase vraie que vous avez transmise pendant la chaîne, ou que vous diriez maintenant</b></label><textarea id="j" data-act="s4txt" data-f="juste" style="min-height:90px">' + esc(ST.s4.juste) + "</textarea>" +
      '<label for="f"><b>Une phrase floue que vous ne direz plus</b></label><textarea id="f" data-act="s4txt" data-f="flou" style="min-height:90px">' + esc(ST.s4.flou) + "</textarea>" +
      '<div class="card teal"><b>👥 Ensemble, à voix haute : question de clôture</b><p>Quelle question de l\'IDE vous a le plus surpris pendant la chaîne, et que feriez-vous pour y répondre avant qu\'elle la pose ?</p></div>' +
      '<button class="btn" data-act="s4copy">Copier mon bilan</button><button class="btn orange" data-act="s4fin">Terminer la séance</button>', { timer: "s4" });
  }

  /* ---------- page de garde ---------- */
  function hm(min) { var h = Math.floor(min / 60) % 24, m = min % 60; return h + " h " + (m < 10 ? "0" : "") + m; }
  function planHtml() {
    var t0 = ST.debut ? (+ST.debut.split(":")[0]) * 60 + (+ST.debut.split(":")[1]) : null, t = t0;
    return STATIONS.map(function (s) {
      var when = t0 === null ? "" : '<span class="when">' + hm(t) + " – " + hm(t + s.m) + "</span>";
      if (t0 !== null) t += s.m;
      return '<li>' + when + "<b>" + esc(s.t) + "</b> <span class=\"dur\">" + s.m + " min</span><br><span class=\"mute\">" + esc(s.d) + " · " + esc(s.mode) + "</span></li>";
    }).join("");
  }
  function affiche() {
    var svg = ""; try { svg = qrSvg(baseUrl() + "#/"); } catch (e) {}
    page("", '<div class="proj"><div>' +
      '<h1>Transmettre juste</h1><p class="sub">Séance en autonomie · 2 h 30</p>' +
      '<h2>Pour commencer</h2><ol class="steps"><li>Formez des groupes de <b>4</b>, en cercle.</li><li>Chacun scanne le QR code avec l\'<b>appareil photo de son téléphone</b>.</li><li>Gardez votre position dans le groupe.</li><li>Lisez en haut de chaque écran : <b>👥 ENSEMBLE</b> = un seul téléphone au centre ; <b>📱 CHACUN</b> = votre téléphone, sans regarder celui des autres.</li></ol>' +
      '<h2>Le plan</h2><ol class="plan" id="plan">' + planHtml() + "</ol>" +
      '<p class="noprint mute">Heure de début (facultatif) : <input type="time" id="debut" data-act="debut" value="' + esc(ST.debut || "") + '"></p>' +
      '</div><div class="qrcol"><div class="qrbox">' + svg + '</div><p class="sub">Scannez ce code avec l\'appareil photo de votre téléphone</p><p class="mute small">' + esc(baseUrl()) + "</p></div></div>", { wide: true, bare: true });
  }

  /* ---------- actions ---------- */
  var ACT = {
    reset: function () { if (confirm("Effacer vos réponses sur cet appareil ?")) { localStorage.removeItem(KEY); ST = loadState(); location.hash = "#/"; route(); } },
    s1p: function (el) { var v = el.dataset.v; if (v === "A") { s1tmp = { pile: "A" }; } else { s1tmp = { pile: v, fb: true }; ST.s1.a.push({ pile: v }); save(); } s1(); },
    s1q: function (el) { s1tmp = { pile: "A", quand: el.dataset.v, fb: true }; ST.s1.a.push({ pile: "A", quand: el.dataset.v }); save(); s1(); },
    s1go: function () { ST.s1.intro = true; save(); s1(); },
    s1next: function () { s1tmp = null; s1(); },
    s1redo: function () { ST.s1 = { i: 0, a: [] }; s1tmp = null; ST.t.s1 = Date.now(); save(); s1(); },
    s2start: function () { ST.s2.i = 0; s2reveal = false; save(); s2(); },
    s2show: function () { var t = $("#rf"); var i = ST.s2.i; ST.s2.a[i] = ST.s2.a[i] || { txt: "", c: [false, false, false, false] }; ST.s2.a[i].txt = t.value; save(); s2reveal = true; s2(); },
    s2txt: function (el) { var i = ST.s2.i; ST.s2.a[i] = ST.s2.a[i] || { txt: "", c: [false, false, false, false] }; ST.s2.a[i].txt = el.value; save(); },
    s2chk: function (el) { var i = ST.s2.i; ST.s2.a[i] = ST.s2.a[i] || { txt: "", c: [false, false, false, false] }; ST.s2.a[i].c[+el.dataset.k] = el.checked; save(); },
    s2next: function () { ST.s2.i++; s2reveal = false; save(); s2(); },
    s2skip: function () { ST.s2.i++; s2reveal = false; save(); s2(); },
    chainlen: function (el) { chainLen = +el.dataset.n; s3(); },
    chainstart: function (el) { var id = +el.dataset.id; var o = { v: 1, s: id, n: chainLen, m: [] }; chain = o; chainKey = "tm.start." + id + "." + Date.now(); drRevealed = false; compose(1); },
    callDr: function () { drRevealed = true; ss(chainKey + ".dr", "1"); compose(chain.m.length + 1); },
    msgtxt: function (el) { ss(chainKey + ".d", el.value); updCount(); },
    send: function () { sendMsg(); },
    back: function () { chain.m = chain.m.slice(0, -1); compose(chain.m.length + 1); },
    copy: async function (el) { var u = el.dataset.url; try { await navigator.clipboard.writeText(u); el.textContent = "Lien copié"; } catch (e) { window.prompt("Copiez ce lien :", u); } },
    share: async function (el) { try { await navigator.share({ title: "Collabotron", url: el.dataset.url }); } catch (e) {} },
    mxcell: function (el) {
      var k = el.dataset.key + "_" + el.dataset.h, par = el.dataset.par;
      if (par) { mx.g[k] = mx.g[k] ? "" : "pres"; el.className = mx.g[k] ? "pres" : ""; el.textContent = mx.g[k] ? "●" : "·"; }
      else { var cur = CYCLE.indexOf(mx.g[k] || ""); var nx = CYCLE[(cur + 1) % CYCLE.length]; mx.g[k] = nx; el.className = nx; el.textContent = SYM[nx]; }
      mxSave(); summary();
    },
    addp: function (el) { var h = el.dataset.h; mx.add[h] = (mx.add[h] || 0) + 1; $("#add" + h).textContent = mx.add[h]; mxSave(); },
    addm: function (el) { var h = el.dataset.h; mx.add[h] = Math.max(0, (mx.add[h] || 0) - 1); $("#add" + h).textContent = mx.add[h]; mxSave(); },
    showfinal: async function () {
      var code = await encodeChain(chain), url = baseUrl() + "#c=" + code, box = $("#finalqr");
      try { box.innerHTML = '<div class="qrbox">' + qrSvg(url) + '</div><p class="notice">Vos coéquipiers scannent ce code pour voir la révélation sur leur téléphone.</p>'; } catch (e) { box.innerHTML = '<div class="card bad">Le QR est trop long à afficher. Utilisez « Copier le lien ».</div>'; }
      box.innerHTML += '<button class="btn alt" data-act="copy" data-url="' + esc(url) + '">Copier le lien</button>';
    },
    debut: function (el) { ST.debut = el.value; save(); var pl = $("#plan"); if (pl) pl.innerHTML = planHtml(); },
    goto: function (el) { ST.prog = Math.max(ST.prog || 0, +el.dataset.n); if (el.dataset.to === "s4") ST.s3.done = true; save(); location.hash = "#/" + el.dataset.to; },
    skip: function () { if (confirm("Tout le groupe a-t-il terminé cette station ?")) { ST.prog = Math.min((ST.prog || 0) + 1, STATIONS.length); save(); home(); } },
    s4txt: function (el) { ST.s4[el.dataset.f] = el.value; save(); },
    s4copy: async function (el) {
      var good = 0; DATA.cartes.forEach(function (c, i) { var a = ST.s1.a[i]; if (a && a.pile === c.pile && (c.pile !== "A" || a.quand === c.quand)) good++; });
      var t = "Bilan : transmettre juste\nTri : " + good + "/" + DATA.cartes.length + "\nUne phrase vraie : " + (ST.s4.juste || "—") + "\nUne phrase floue que je ne dirai plus : " + (ST.s4.flou || "—");
      try { await navigator.clipboard.writeText(t); el.textContent = "Bilan copié"; } catch (e) { window.prompt("Copiez votre bilan :", t); }
    },
    s4fin: function () { ST.s4.fin = true; ST.prog = STATIONS.length; save(); page("Bilan", '<div class="card ok"><b>Séance terminée.</b><p>Merci. Vos réponses restent sur votre téléphone. Vous pouvez effacer vos données depuis l\'accueil.</p></div><a class="btn" href="#/">Retour à l\'accueil</a>'); }
  };

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    if (el.tagName === "TEXTAREA" || el.tagName === "INPUT") return;
    var f = ACT[el.dataset.act]; if (!f) return;
    var keep = f(el); if (!keep) e.preventDefault();
  });
  document.addEventListener("input", function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.act) return;
    if ((el.tagName === "TEXTAREA" || el.type === "time") && ACT[el.dataset.act]) ACT[el.dataset.act](el);
  });
  document.addEventListener("change", function (e) {
    var el = e.target; if (el.tagName === "INPUT" && el.type === "checkbox" && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el);
  });

  /* ---------- routeur ---------- */
  function route() {
    var h = location.hash || "";
    if (h === "") return affiche(); /* adresse seule = page de garde avec plan et QR */
    if (h.indexOf("#c=") === 0) return chainView(h.slice(3));
    var p = h.replace(/^#\/?/, "") || "home";
    if (ORDER[p] !== undefined && ORDER[p] > (ST.prog || 0)) { homeNoteAt = Date.now(); if (location.hash !== "#/") { location.hash = "#/"; return; } p = "home"; }
    ({ home: home, s1: s1, s2: s2, s3: s3, s4: s4, affiche: affiche }[p] || home)();
  }
  window.addEventListener("hashchange", route);
  window.__tm = { route: route, encodeChain: encodeChain, decodeChain: decodeChain, state: function () { return ST; } };
  route();
})();
</script>
